services:
  - type: web
    name: creditlens-credit-risk
    runtime: docker
    repo: https://github.com/<your-username>/creditlens.git
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
